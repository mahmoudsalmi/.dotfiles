[tools]
atuin = "18.24.2"
bat = "0.26.1"
btop = { version = "1.4.8", os = ["linux"] }
chezmoi = "2.73.3"
fastfetch = "2.70.0"
fd = "10.5.0"
fzf = "0.74.5"
gh = "2.103.2"
git-lfs = "3.8.1"
lazygit = "0.66.2"
lsd = "1.2.0"
neovim = "0.12.6"
pi = "1.4.0"
ripgrep = "15.2.0"
starship = "1.27.0"
tmux = "3.7c"
yazi = "26.9.1"
zoxide = "0.10.0"

# New `mise use --global` tools belong to the untracked machine-local file.
[settings.write_targets]
tools = "~/.config/mise/config.local.toml"

# Linux build tools compile Neovim Tree-sitter parsers. Packages for managers
# not installed on the current distribution are skipped by mise.
[bootstrap.packages]
"apk:build-base" = { os = "linux" }
"apt:build-essential" = { os = "linux" }
"dnf:gcc" = { os = "linux" }
"pacman:base-devel" = { os = "linux" }
# Homebrew provides its current formula version, rather than a version pin.
"brew:btop" = { os = "macos" }

[tasks.update]
description = "Review dotfile updates, then update mise tools and native packages"
run = 'sh "${XDG_CONFIG_HOME:-$HOME/.config}/mise/scripts/update.sh"'

[tasks."install:packages"]
description = "Install platform packages (btop via Homebrew on macOS)"
run = 'sh "${XDG_CONFIG_HOME:-$HOME/.config}/mise/scripts/install-packages.sh"'

[tasks."services:macos"]
description = "Install macOS launchd limits (maxfiles, maxproc); requires sudo"
run = 'sh "${XDG_CONFIG_HOME:-$HOME/.config}/mise/scripts/install-macos-services.sh"'

[tasks."terminfo:push"]
description = "Install a local terminfo entry on an SSH host"
usage = '''
arg "<host>" env="MISE_TERMINFO_HOST" help="SSH host or config alias"
arg "[entry]" default="xterm-ghostty" env="MISE_TERMINFO_ENTRY" help="Local terminfo entry to install"
'''
run = 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/mise/scripts/push-terminfo.sh"'
