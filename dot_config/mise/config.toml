[tools]
atuin = "18.24.2"
bat = "0.26.1"
btop = { version = "1.4.8", os = ["linux"] }
chezmoi = "2.73.3"
fastfetch = "2.70.0"
fd = "10.5.0"
fzf = "0.74.5"
gh = "2.103.2"
git-lfs = "3.8.1"
lazygit = "0.66.2"
lsd = "1.2.0"
neovim = "0.12.6"
ripgrep = "15.2.0"
starship = "1.27.0"
tmux = "3.7c"
yazi = "26.9.1"
zoxide = "0.10.0"

# Native packages have no mise shims; Zsh adds the Homebrew prefix to PATH.
# Homebrew provides its current formula version, rather than a version pin.
[bootstrap.packages]
"brew:btop" = { os = "macos" }

[tasks."install:packages"]
description = "Install platform packages (btop via Homebrew on macOS)"
run = 'sh "${XDG_CONFIG_HOME:-$HOME/.config}/mise/scripts/install-packages.sh"'
