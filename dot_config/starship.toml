"$schema" = 'https://starship.rs/config-schema.json'

# Explicit layout: project context first, command input on its own line.
add_newline = true
format = '$username$hostname$directory$git_branch$git_state$git_status$docker_context$nodejs$java$python$rust$golang$cmd_duration$jobs$fill$battery$line_break$time$character'
right_format = ''

[fill]
symbol = ' '

[directory]
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
read_only = ' 🔒'

[username]
show_always = false
format = '[$user]($style) '

[hostname]
ssh_only = true
ssh_symbol = ''
format = 'at [$hostname](bold yellow) '

[git_branch]
format = 'on [$symbol$branch]($style) '
truncation_length = 32

[cmd_duration]
min_time = 2000
format = 'took [$duration](bold yellow) '

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold yellow)'

[time]
disabled = false
time_format = '%H:%M:%S'
format = '[$time](dimmed white) '

[battery]
full_symbol = '🔋 '
charging_symbol = '⚡ '
discharging_symbol = '🔋 '

[[battery.display]]
threshold = 20
style = 'bold red'

[[battery.display]]
threshold = 40
style = 'bold yellow'

