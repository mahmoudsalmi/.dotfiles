# ╔══════════════════════════════════════════════════════════╗
# ║  tmux.conf — session management + catppuccin mocha       ║
# ╚══════════════════════════════════════════════════════════╝

# ─── Terminal & Core ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,alacritty:Tc"
set -g set-clipboard on
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g status-interval 3
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u

# ─── Indexing ────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ─── Reload ─────────────────────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "  Config reloaded"

# ─── Vi Mode ────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ─── Pane Navigation ────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits (keep cwd)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─── Session Management Keybindings ─────────────────────────
# Fuzzy switch session (fzf)
bind s display-popup -E -w 60% -h 60% "~/.config/tmux/scripts/switch-session.sh"

# Create named session (new-session without -d auto-switches)
bind S command-prompt -p "  New session:" "new-session -s '%%'"

# Kill session and hop to next
bind X confirm-before -p "Kill #S? (y/n)" \
  "run-shell 'tmux switch-client -n; tmux kill-session -t \"#S\"'"

# Save current session layout
# bind W run-shell "~/.config/tmux/scripts/tm save '#{session_name}'"

# Load a saved session (fzf picker)
# bind E display-popup -E -w 60% -h 60% "\
  ls ~/.config/tmux/sessions/ 2>/dev/null | sed 's/\\.sh$//' | \
  fzf --reverse --header='  Load Session' | \
  xargs -I{} ~/.config/tmux/scripts/tm load {}"

# Fuzzy find window across all sessions
# Fuzzy find window across all sessions
bind f display-popup -E -w 85% -h 85% "~/.config/tmux/scripts/find-window.sh"

### Popups
# Show current pane's path in a popu
bind P display-popup -w 85% -h 85% -d '#{pane_current_path}'
# Show current pane's path in a popup and run lazygit
bind G display-popup -w 85% -h 85% -d '#{pane_current_path}' lazygit
# Show current pane's path in a popup and run nvim
bind N display-popup -w 85% -h 85% -d '#{pane_current_path}' nvim .
# Show current pane's path in a popup and run btop
bind B display-popup -w 85% -h 85% -d '#{pane_current_path}' btop


# ─── Plugins (TPM) ──────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect
set -g @resurrect-dir '~/.config/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum — auto-save every 10 min
set -g @continuum-save-interval '10'

# Auto-restore on tmux start
set -g @continuum-restore 'on'

# ─── Catppuccin Mocha Theme ─────────────────────────────────
crust="#11111b"
mantle="#181825"
base="#1e1e2e"
surface0="#313244"
surface1="#45475a"
overlay0="#6c7086"
text="#cdd6f4"
lavender="#b4befe"
blue="#89b4fa"
sapphire="#74c7ec"
mauve="#cba6f7"
green="#a6e3a1"

# Status bar
set -g status-position top
set -g status-style "bg=$base,fg=$text"
set -g status-left-length 50
set -g status-right-length 100
set -g status-justify centre

set -g status-left "#[bg=$blue,fg=$crust,bold] 󰣇 #S #[bg=$surface0,fg=$blue]#[bg=$surface0,fg=$text] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '') #[bg=$base,fg=$surface0]"
set -g status-right "#[fg=$green]#{?@continuum_save, 󰁯,}#[default] #[bg=$base,fg=$lavender]#[bg=$lavender,fg=$crust] 󰥔 %H:%M #[bg=$base,fg=$blue]#[bg=$blue,fg=$crust] 󰃭 %d-%b "

# Windows
set -g window-status-format "#[bg=$surface0,fg=$text] #I #W "
set -g window-status-current-format "#[bg=$sapphire,fg=$crust,bold] #I #W "
set -g window-status-separator ""
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

# Panes
set -g pane-border-style "fg=$surface1"
set -g pane-active-border-style "fg=$blue"
set -g popup-border-style "fg=$blue"

# ─── Save/restore sessions ─────────────────────────────
# Manual save/restore: prefix, then Shift-W / Shift-E
set -g @resurrect-save 'W'
set -g @resurrect-restore 'E'

# Automatic save every 10 minutes; restore when tmux starts
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'

# ─── Initialize TPM (keep last) ─────────────────────────────
# Plugin files are installed by chezmoi.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
run-shell '~/.config/tmux/plugins/tpm/tpm'
