[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
title = "Alacritty"
dynamic_padding = false
padding = { x = 4, y = 4 }
option_as_alt = "None"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[scrolling]
history = 100000

[font]
size = 15.0

[font.normal]
family = "Monaspace Neon"
style = "Regular"

[font.bold]
family = "Monaspace Neon"
style = "Bold"

[font.italic]
family = "Monaspace Neon"
style = "Italic"

[font.bold_italic]
family = "Monaspace Neon"
style = "Bold Italic"

[font.offset]
x = 1
y = 4

[colors.primary]
background = "#24273a"
foreground = "#cad3f5"
bright_foreground = "#b8c0e0"

[colors.cursor]
text = "#181926"
cursor = "#f4dbd6"

[colors.selection]
text = "#cad3f5"
background = "#3a3e53"

[colors.normal]
black = "#494d64"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#f5bde6"
cyan = "#8bd5ca"
white = "#a5adcb"

[colors.bright]
black = "#5b6078"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#f5bde6"
cyan = "#8bd5ca"
white = "#b8c0e0"

[mouse]
hide_when_typing = true

[cursor]
style = "Block"
unfocused_hollow = true
vi_mode_style = "Underline"
